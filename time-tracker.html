        }

        function bindSettingsEvents() {
            // 添加休息时段按钮
            const addBtn = document.getElementById('btn-add-break-period');
            if (addBtn) {
                addBtn.onclick = addBreakPeriod;
            }

            // 保存设置按钮
            const saveBtn = document.getElementById('btn-save-settings');
            if (saveBtn) {
                saveBtn.onclick = saveSettings;
            }

            // 返回 Dashboard 按钮
            const backBtn = document.getElementById('btn-back-to-dashboard');
            if (backBtn) {
                backBtn.onclick = function() {
                    switchView('dashboard');
                };
            }

            // 删除休息时段按钮
            const deleteBtns = document.querySelectorAll('[data-delete-break]');
            deleteBtns.forEach(btn => {
                btn.onclick = function() {
                    const index = parseInt(this.dataset.deleteBreak, 10);
                    deleteBreakPeriod(index);
                };
            });
        }

        function addBreakPeriod() {
            const container = document.getElementById('break-periods-list');
            if (!container) return;

            const breakPeriods = getBreakPeriods();
            breakPeriods.push({ name: '', start: '12:00', end: '13:00', color: '#f59e0b' });

            const index = breakPeriods.length - 1;
            const html = buildBreakPeriodItemHTML(breakPeriods[index], index);

            // 如果之前是空状态，清空容器
            if (breakPeriods.length === 1) {
                container.innerHTML = '';
            }

            container.insertAdjacentHTML('beforeend', html);
            bindSettingsEvents();
        }

        function deleteBreakPeriod(index) {
            const container = document.getElementById('break-periods-list');
            if (!container) return;

            // 收集当前所有输入的值
            const items = container.querySelectorAll('.break-period-item');
            const breakPeriods = [];
            items.forEach((item, i) => {
                if (i === index) return; // 跳过要删除的项
                const nameInput = item.querySelector('[data-break-name]');
                const startInput = item.querySelector('[data-break-start]');
                const endInput = item.querySelector('[data-break-end]');
                const colorInput = item.querySelector('[data-break-color]');
                breakPeriods.push({
                    name: nameInput ? nameInput.value : '',
                    start: startInput ? startInput.value : '12:00',
                    end: endInput ? endInput.value : '13:00',
                    color: colorInput ? colorInput.value : '#f59e0b'
                });
            });

            // 重新渲染
            let html = '';
            if (breakPeriods.length === 0) {
                html = '<div class="text-sm text-slate-500 py-4">暂无休息时段配置</div>';
            } else {
                breakPeriods.forEach((period, i) => {
                    html += buildBreakPeriodItemHTML(period, i);
                });
            }
            container.innerHTML = html;
            bindSettingsEvents();
        }

        function saveSettings() {
            const container = document.getElementById('break-periods-list');
            if (!container) return;

            const items = container.querySelectorAll('.break-period-item');
            const breakPeriods = [];

            items.forEach((item, index) => {
                const nameInput = item.querySelector(`[data-break-name="${index}"]`);
                const startInput = item.querySelector(`[data-break-start="${index}"]`);
                const endInput = item.querySelector(`[data-break-end="${index}"]`);
                const colorInput = item.querySelector(`[data-break-color="${index}"]`);

                const name = nameInput ? nameInput.value.trim() : '';
                const start = startInput ? startInput.value : '';
                const end = endInput ? endInput.value : '';
                const color = colorInput ? colorInput.value : '#f59e0b';

                if (name && start && end) {
                    breakPeriods.push({ name, start, end, color });
                }
            });

            saveBreakPeriods(breakPeriods);

            // 重新计算所有任务的有效时长
            recalculateAllTasksEffectiveDuration();

            // 刷新 Dashboard 显示
            todayTasks.forEach(task => renderTaskCard(task));
            updateDashboardStats();
            updateActiveTaskBanner();

            alert('设置已保存');
        }

        // ----- 视图切换 -----
        function switchView(viewName) {
            const dashboardView = document.getElementById('active-task-banner');
            const statsContainer = document.getElementById('stats-container');
            const tasksSection = document.getElementById('dashboard-tasks-section');
            const historyView = document.getElementById('history-view');
            const settingsView = document.getElementById('settings-view');
            const headerTitle = document.getElementById('header-title');
            const headerDate = document.getElementById('header-date');

            const navDashboard = document.getElementById('nav-dashboard');
            const navToday = document.getElementById('nav-today');
            const navHistory = document.getElementById('nav-history');
            const navSettings = document.getElementById('nav-settings');

            // 重置所有导航项高亮
            [navDashboard, navToday, navHistory, navSettings].forEach(nav => {
                if (nav) nav.classList.remove('active');
            });

            // 隐藏所有视图
            if (settingsView) settingsView.classList.add('hidden');
            if (historyView) historyView.classList.add('hidden');

            if (viewName === 'dashboard') {
                // 显示 Dashboard 视图
                if (dashboardView) dashboardView.classList.remove('hidden');
                if (statsContainer) statsContainer.classList.remove('hidden');
                if (tasksSection) tasksSection.classList.remove('hidden');
                if (headerTitle) headerTitle.textContent = '数据概览';
                if (headerDate) headerDate.classList.remove('hidden');

                if (navDashboard) navDashboard.classList.add('active');

                // 恢复今日任务数据
                initDashboard();
            } else if (viewName === 'today') {
                // 今日任务视图（同 Dashboard）
                if (dashboardView) dashboardView.classList.remove('hidden');
                if (statsContainer) statsContainer.classList.remove('hidden');
                if (tasksSection) tasksSection.classList.remove('hidden');
                if (headerTitle) headerTitle.textContent = '今日任务';
                if (headerDate) headerDate.classList.remove('hidden');

                if (navToday) navToday.classList.add('active');

                initDashboard();
            } else if (viewName === 'history') {
                // 显示历史视图
                if (dashboardView) dashboardView.classList.add('hidden');
                if (statsContainer) statsContainer.classList.add('hidden');
                if (tasksSection) tasksSection.classList.add('hidden');
                if (historyView) historyView.classList.remove('hidden');
                if (headerTitle) headerTitle.textContent = '历史记录';
                if (headerDate) headerDate.classList.add('hidden');

                if (navHistory) navHistory.classList.add('active');

                // 初始化日期选择器
                const datePicker = document.getElementById('history-date-picker');
                if (datePicker && !datePicker.value) {
                    datePicker.value = getDefaultHistoryDate();
                }

                // 加载历史数据
                const selectedDate = datePicker ? datePicker.value : getDefaultHistoryDate();
                renderHistoryView(selectedDate);
            } else if (viewName === 'settings') {
                // 显示设置视图
                if (dashboardView) dashboardView.classList.add('hidden');
                if (statsContainer) statsContainer.classList.add('hidden');
                if (tasksSection) tasksSection.classList.add('hidden');
                if (historyView) historyView.classList.add('hidden');
                if (settingsView) settingsView.classList.remove('hidden');
                if (headerTitle) headerTitle.textContent = '系统设置';
                if (headerDate) headerDate.classList.add('hidden');

                if (navSettings) navSettings.classList.add('active');

                renderSettingsView();
            }
        }

        // ----- 事件绑定 -----
        function bindAllEvents() {
            console.log('[bindAllEvents] 开始绑定事件');
            
            const btnNewTask = document.getElementById('btn-new-task');
            if (btnNewTask) {
                console.log('[bindAllEvents] 绑定新建任务按钮');
                btnNewTask.addEventListener('click', handleNewTask);
            } else {
                console.warn('[bindAllEvents] 未找到新建任务按钮');
            }

            // 侧边栏导航事件
            const navDashboard = document.getElementById('nav-dashboard');
            const navToday = document.getElementById('nav-today');
            const navHistory = document.getElementById('nav-history');
            const navSettings = document.getElementById('nav-settings');

            if (navDashboard) {
                navDashboard.addEventListener('click', function() { switchView('dashboard'); });
            }
            if (navToday) {
                navToday.addEventListener('click', function() { switchView('today'); });
            }
            if (navHistory) {
                navHistory.addEventListener('click', function() { switchView('history'); });
            }
            if (navSettings) {
                navSettings.addEventListener('click', function() { switchView('settings'); });
            }

            // 日期选择器事件
            const datePicker = document.getElementById('history-date-picker');
            if (datePicker) {
                datePicker.addEventListener('change', function() {
                    if (this.value) {
                        renderHistoryView(this.value);
                    }
                });
            }

            // 导出按钮事件
            const exportBtn = document.getElementById('export-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', exportData);
            }

            // 导入按钮事件
            const importBtn = document.getElementById('import-btn');
            const importFile = document.getElementById('import-file');
            if (importBtn && importFile) {
                importBtn.addEventListener('click', function() {
                    importFile.click();
                });
                importFile.addEventListener('change', function() {
                    if (this.files && this.files.length > 0) {
                        importData(this.files[0]);
                    }
                });
            }
            
            console.log('[bindAllEvents] 事件绑定完成');
        }
        
        // 确保在 DOM 准备好后绑定事件和初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                bindAllEvents();
                initDashboard();
                initTheme();
            });
        } else {
            // DOM 已经加载完成
            bindAllEvents();
            initDashboard();
            initTheme();
        }

        // ==========================================
        // V2-009: 数据导出导入
        // ==========================================

        function exportData() {
            const tasks = {};
            const config = localStorage.getItem('time-tracker-config');

            // Collect all time-tracker-tasks-* entries
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('time-tracker-tasks-')) {
                    const dateStr = key.replace('time-tracker-tasks-', '');
                    const data = localStorage.getItem(key);
                    if (data) {
                        tasks[dateStr] = JSON.parse(data);
                    }
                }
            }

            const exportObj = {
                version: '2.0',
                exportDate: new Date().toISOString(),
                tasks: tasks,
                config: config ? JSON.parse(config) : { breakPeriods: [] }
            };

            const jsonStr = JSON.stringify(exportObj, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const filename = `time-tracker-v2-backup-${year}-${month}-${day}.json`;

            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function convertV1ToV2(v1Data) {
            const tasks = {};

            // Convert records to tasks format
            if (v1Data.records) {
                for (const [dateStr, records] of Object.entries(v1Data.records)) {
                    if (!Array.isArray(records)) continue;

                    // Group records by taskName
                    const taskGroups = {};
                    records.forEach(record => {
                        const name = record.taskName || '未命名任务';
                        if (!taskGroups[name]) {
                            taskGroups[name] = [];
                        }
                        taskGroups[name].push(record);
                    });

                    // Create tasks for each group
                    tasks[dateStr] = [];
                    for (const [taskName, groupRecords] of Object.entries(taskGroups)) {
                        const task = createTask(taskName);
                        task.status = 'completed';

                        groupRecords.forEach(record => {
                            const segment = {
                                id: record.id || generateId(),
                                startTime: record.startTime,
                                endTime: record.endTime,
                                rawDuration: record.rawDuration || 0,
                                effectiveDuration: record.effectiveDuration || 0,
                                breakOverlapMinutes: 0
                            };
                            task.segments.push(segment);
                        });

                        updateTaskTotals(task);
                        tasks[dateStr].push(task);
                    }
                }
            }

            return {
                version: '2.0',
                exportDate: v1Data.exportDate || new Date().toISOString(),
                tasks: tasks,
                config: v1Data.config || { breakPeriods: [] }
            };
        }

        function importData(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    // Validate format
                    if (!data || typeof data !== 'object') {
                        alert('文件格式不正确');
                        return;
                    }

                    // Check version and convert if needed
                    let importData = data;
                    if (data.version === '1.0') {
                        alert('检测到 V1 格式数据，将尝试转换导入');
                        importData = convertV1ToV2(data);
                    } else if (data.version !== '2.0') {
                        alert('文件格式不正确');
                        return;
                    }

                    // Validate V2 structure
                    if (!importData.tasks || typeof importData.tasks !== 'object' || !importData.config) {
                        alert('文件格式不正确');
                        return;
                    }

                    // Confirm import
                    if (!confirm('导入将覆盖现有数据，是否继续？')) {
                        return;
                    }

                    // Clear existing data
                    const keysToRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && (key.startsWith('time-tracker-tasks-') || key === 'time-tracker-config')) {
                            keysToRemove.push(key);
                        }
                    }
                    keysToRemove.forEach(key => localStorage.removeItem(key));

                    // Write imported data
                    for (const [dateStr, taskList] of Object.entries(importData.tasks)) {
                        localStorage.setItem('time-tracker-tasks-' + dateStr, JSON.stringify(taskList));
                    }
                    localStorage.setItem('time-tracker-config', JSON.stringify(importData.config));

                    // Refresh page
                    window.location.reload();

                } catch (err) {
                    alert('文件格式不正确');
                }
            };
            reader.readAsText(file);
        }

        // ==========================================
        // TASK-001: 主题切换系统
        // ==========================================

        const THEME_STORAGE_KEY = 'time-tracker-theme';

        function getTheme() {
            const saved = localStorage.getItem(THEME_STORAGE_KEY);
            if (saved === 'light' || saved === 'dark' || saved === 'system') {
                return saved;
            }
            return 'light';
        }

        function setTheme(theme) {
            if (theme !== 'light' && theme !== 'dark' && theme !== 'system') {
                theme = 'light';
            }

            localStorage.setItem(THEME_STORAGE_KEY, theme);

            const body = document.body;
            if (theme === 'dark') {
                body.classList.add('bp5-dark');
            } else if (theme === 'light') {
                body.classList.remove('bp5-dark');
            } else if (theme === 'system') {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.add('bp5-dark');
                } else {
                    body.classList.remove('bp5-dark');
                }
            }

            // 同步更新设置页面中的 select
            const themeSelect = document.getElementById('theme-select');
            if (themeSelect) {
                themeSelect.value = theme;
            }
        }

        function toggleTheme() {
            const current = getTheme();
            const next = current === 'light' ? 'dark' : 'light';
            setTheme(next);
        }

        function initTheme() {
            const theme = getTheme();
            setTheme(theme);

            // 监听系统主题变化
            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = function(e) {
                    if (getTheme() === 'system') {
                        if (e.matches) {
                            document.body.classList.add('bp5-dark');
                        } else {
                            document.body.classList.remove('bp5-dark');
                        }
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleChange);
                }
            }
        }

        // 绑定主题选择器事件
        document.addEventListener('DOMContentLoaded', function() {
            const themeSelect = document.getElementById('theme-select');
            if (themeSelect) {
                themeSelect.addEventListener('change', function() {
                    setTheme(this.value);
                });
            }
        });

        console.log('V2 Modern Dashboard UI 已加载');
    </script>
